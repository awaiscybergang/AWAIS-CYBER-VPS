<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWAIS CYBER VPS - Powerful Cloud Hosting</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0B0F19 0%, #0a0e17 100%);
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Glassmorphism Effects */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 207, 255, 0.2);
            border-radius: 16px;
        }

        .glass-card {
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 207, 255, 0.3);
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(0, 207, 255, 0.8);
            box-shadow: 0 0 20px rgba(0, 207, 255, 0.2);
            transform: translateY(-5px);
        }

        /* Neon Text */
        .neon-text {
            text-shadow: 0 0 10px rgba(0, 207, 255, 0.5), 0 0 20px rgba(138, 43, 226, 0.3);
        }

        .neon-border {
            border: 1px solid #00CFFF;
            box-shadow: 0 0 10px rgba(0, 207, 255, 0.3);
        }

        /* Gradient Backgrounds */
        .gradient-bg {
            background: linear-gradient(135deg, #00CFFF, #8A2BE2, #00FFD5);
            background-size: 200% 200%;
            animation: gradient 3s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, #00CFFF, #8A2BE2);
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 207, 255, 0.3);
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(0, 207, 255, 0.2);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .sidebar.active {
            transform: translateX(0);
        }

        .sidebar-item {
            padding: 12px 20px;
            margin: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sidebar-item:hover, .sidebar-item.active {
            background: linear-gradient(135deg, rgba(0, 207, 255, 0.2), rgba(138, 43, 226, 0.2));
            border-left: 3px solid #00CFFF;
        }

        /* Main Content */
        .main-content {
            margin-left: 0;
            transition: margin-left 0.3s ease;
            padding: 20px;
        }

        .main-content.sidebar-open {
            margin-left: 260px;
        }

        /* Dashboard Cards */
        .stat-card {
            background: rgba(11, 15, 25, 0.8);
            border: 1px solid rgba(0, 207, 255, 0.2);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: #00CFFF;
            transform: translateY(-5px);
        }

        /* Terminal */
        .terminal {
            background: #000000;
            border-radius: 12px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            color: #00FF00;
            height: 400px;
            overflow-y: auto;
        }

        .terminal-input {
            background: transparent;
            border: none;
            color: #00FF00;
            font-family: 'Courier New', monospace;
            width: 100%;
            outline: none;
        }

        /* File Manager */
        .file-item {
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-item:hover {
            background: rgba(0, 207, 255, 0.1);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
            }
            .main-content.sidebar-open {
                margin-left: 0;
            }
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fadeInUp {
            animation: fadeInUp 0.6s ease forwards;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        ::-webkit-scrollbar-thumb {
            background: #00CFFF;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #8A2BE2;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0B0F19; z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column;">
        <div class="gradient-bg" style="width: 60px; height: 60px; border-radius: 50%; animation: pulse 1s infinite;"></div>
        <h2 class="neon-text" style="margin-top: 20px;">AWAIS CYBER VPS</h2>
        <p>Loading...</p>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div style="padding: 30px 20px; text-align: center;">
            <h2 class="neon-text">AWAIS CYBER</h2>
            <p style="font-size: 12px; opacity: 0.7;">VPS Hosting Platform</p>
        </div>
        <div id="sidebar-menu"></div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="main-content">
        <!-- Top Bar -->
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px; background: rgba(11, 15, 25, 0.8); border-radius: 16px; margin-bottom: 20px;">
            <div>
                <i class="fas fa-bars" id="menu-toggle" style="font-size: 24px; cursor: pointer;"></i>
            </div>
            <div style="display: flex; gap: 20px; align-items: center;">
                <span id="user-name" style="font-weight: 600;"></span>
                <i class="fas fa-user-circle" style="font-size: 32px; color: #00CFFF;"></i>
                <button id="logout-btn" class="btn-primary" style="padding: 8px 16px;">Logout</button>
            </div>
        </div>

        <!-- Dynamic Content -->
        <div id="page-content"></div>
    </div>

    <script>
        // State Management
        let currentUser = null;
        let currentPage = 'dashboard';
        let socket = null;
        let metricsInterval = null;

        // API Base URL
        const API_URL = window.location.origin + '/api';

        // Helper Functions
        function showLoading() {
            document.getElementById('loading').style.display = 'flex';
        }

        function hideLoading() {
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 500);
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.right = '20px';
            toast.style.padding = '12px 24px';
            toast.style.background = type === 'success' ? '#00FFD5' : '#FF3366';
            toast.style.color = '#0B0F19';
            toast.style.borderRadius = '8px';
            toast.style.zIndex = '9999';
            toast.style.fontWeight = '600';
            toast.innerText = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Authentication Functions
        async function login(email, password) {
            showLoading();
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.accessToken);
                    localStorage.setItem('refreshToken', data.refreshToken);
                    currentUser = data.user;
                    initApp();
                    showToast('Login successful!');
                } else {
                    showToast(data.error || 'Login failed', 'error');
                }
            } catch (error) {
                showToast('Network error', 'error');
            }
            hideLoading();
        }

        async function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('refreshToken');
            currentUser = null;
            if (socket) socket.disconnect();
            if (metricsInterval) clearInterval(metricsInterval);
            showLoginPage();
            showToast('Logged out successfully');
        }

        // Page Rendering
        function showLoginPage() {
            document.getElementById('page-content').innerHTML = `
                <div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
                    <div class="glass-card" style="padding: 40px; max-width: 400px; width: 100%;">
                        <h2 class="neon-text" style="text-align: center; margin-bottom: 30px;">Welcome Back</h2>
                        <form id="login-form">
                            <input type="email" id="email" placeholder="Email" required style="width: 100%; padding: 12px; margin-bottom: 16px; background: rgba(255,255,255,0.1); border: 1px solid rgba(0,207,255,0.3); border-radius: 8px; color: white;">
                            <input type="password" id="password" placeholder="Password" required style="width: 100%; padding: 12px; margin-bottom: 24px; background: rgba(255,255,255,0.1); border: 1px solid rgba(0,207,255,0.3); border-radius: 8px; color: white;">
                            <button type="submit" class="btn-primary" style="width: 100%;">Login</button>
                        </form>
                        <p style="text-align: center; margin-top: 20px;">Demo: admin@awaicyber.com / Admin@123456</p>
                    </div>
                </div>
            `;
            document.getElementById('login-form').addEventListener('submit', (e) => {
                e.preventDefault();
                login(document.getElementById('email').value, document.getElementById('password').value);
            });
        }

        // Dashboard Page
        async function renderDashboard() {
            showLoading();
            const metrics = await fetchMetrics();
            const deployments = await fetchDeployments();
            
            document.getElementById('page-content').innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px;">
                    <div class="stat-card">
                        <i class="fas fa-microchip" style="font-size: 32px; color: #00CFFF;"></i>
                        <h3 style="margin-top: 10px;">CPU Usage</h3>
                        <p style="font-size: 32px; font-weight: bold;">${metrics.cpu?.usage?.toFixed(1) || 0}%</p>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-memory" style="font-size: 32px; color: #8A2BE2;"></i>
                        <h3 style="margin-top: 10px;">RAM Usage</h3>
                        <p style="font-size: 32px; font-weight: bold;">${((metrics.memory?.used || 0) / (1024 ** 3)).toFixed(1)} GB</p>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-hdd" style="font-size: 32px; color: #00FFD5;"></i>
                        <h3 style="margin-top: 10px;">Storage</h3>
                        <p style="font-size: 32px; font-weight: bold;">${deployments.length}</p>
                        <p>Active Deployments</p>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-clock" style="font-size: 32px; color: #00CFFF;"></i>
                        <h3 style="margin-top: 10px;">Uptime</h3>
                        <p style="font-size: 32px; font-weight: bold;">${Math.floor(metrics.uptime?.system / 3600)}h</p>
                    </div>
                </div>
                <div class="glass-card" style="padding: 20px;">
                    <h3>Recent Deployments</h3>
                    <div id="deployments-list"></div>
                </div>
            `;
            
            const deploymentsList = document.getElementById('deployments-list');
            if (deployments.length === 0) {
                deploymentsList.innerHTML = '<p style="text-align: center; padding: 40px;">No deployments yet. Create your first deployment!</p>';
            } else {
                deploymentsList.innerHTML = deployments.slice(0, 5).map(d => `
                    <div style="display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid rgba(0,207,255,0.1);">
                        <span><i class="fas fa-code"></i> ${d.name}</span>
                        <span style="color: ${d.status === 'running' ? '#00FFD5' : '#FF3366'}">${d.status}</span>
                    </div>
                `).join('');
            }
            hideLoading();
        }

        // Deployments Page
        async function renderDeployments() {
            showLoading();
            const deployments = await fetchDeployments();
            
            document.getElementById('page-content').innerHTML = `
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                    <h2 class="neon-text">My Deployments</h2>
                    <button class="btn-primary" onclick="showCreateDeploymentModal()"><i class="fas fa-plus"></i> New Deployment</button>
                </div>
                <div id="deployments-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px;"></div>
            `;
            
            const grid = document.getElementById('deployments-grid');
            if (deployments.length === 0) {
                grid.innerHTML = '<div class="glass-card" style="padding: 60px; text-align: center;"><i class="fas fa-cloud-upload-alt" style="font-size: 48px;"></i><h3>No Deployments</h3><p>Create your first deployment to get started</p></div>';
            } else {
                grid.innerHTML = deployments.map(d => `
                    <div class="glass-card" style="padding: 20px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <i class="fas fa-${d.type === 'nodejs' ? 'node-js' : d.type === 'python' ? 'python' : 'globe'}" style="font-size: 32px; color: #00CFFF;"></i>
                            <span style="padding: 4px 12px; border-radius: 20px; background: ${d.status === 'running' ? 'rgba(0,255,213,0.2)' : 'rgba(255,51,102,0.2)'}; color: ${d.status === 'running' ? '#00FFD5' : '#FF3366'}">${d.status}</span>
                        </div>
                        <h3>${d.name}</h3>
                        <p style="opacity: 0.7; font-size: 12px;">Port: ${d.port}</p>
                        <div style="display: flex; gap: 10px; margin-top: 15px;">
                            ${d.status !== 'running' ? `<button class="btn-primary" onclick="startDeployment('${d._id}')" style="flex: 1; padding: 8px;">Start</button>` : `<button onclick="stopDeployment('${d._id}')" style="flex: 1; padding: 8px; background: #FF3366; border: none; border-radius: 6px; color: white; cursor: pointer;">Stop</button>`}
                            <button onclick="deleteDeployment('${d._id}')" style="flex: 1; padding: 8px; background: rgba(255,51,102,0.2); border: 1px solid #FF3366; border-radius: 6px; color: #FF3366; cursor: pointer;">Delete</button>
                        </div>
                    </div>
                `).join('');
            }
            hideLoading();
        }

        // Terminal Page
        function renderTerminal() {
            document.getElementById('page-content').innerHTML = `
                <h2 class="neon-text" style="margin-bottom: 20px;">Browser Terminal</h2>
                <div class="glass-card" style="padding: 20px;">
                    <div class="terminal" id="terminal-output">
                        <div>Welcome to Awais Cyber VPS Terminal</div>
                        <div>Type commands below to execute</div>
                        <div>$ </div>
                    </div>
                    <div style="margin-top: 10px; display: flex;">
                        <span style="color: #00FF00;">$&nbsp;</span>
                        <input type="text" id="terminal-input" class="terminal-input" placeholder="Enter command..." autofocus>
                    </div>
                </div>
            `;
            
            const terminalInput = document.getElementById('terminal-input');
            const terminalOutput = document.getElementById('terminal-output');
            
            terminalInput.addEventListener('keypress', async (e) => {
                if (e.key === 'Enter') {
                    const command = terminalInput.value;
                    terminalOutput.innerHTML += `<div>$ ${command}</div>`;
                    terminalInput.value = '';
                    
                    const response = await fetch(`${API_URL}/terminal/command`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({ command })
                    });
                    const data = await response.json();
                    terminalOutput.innerHTML += `<div>${data.output || data.error || 'Command executed'}</div>`;
                    terminalOutput.scrollTop = terminalOutput.scrollHeight;
                }
            });
        }

        // File Manager Page
        async function renderFileManager() {
            showLoading();
            const files = await fetchFiles('/');
            
            document.getElementById('page-content').innerHTML = `
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                    <h2 class="neon-text">File Manager</h2>
                    <div>
                        <button class="btn-primary" onclick="uploadFile()"><i class="fas fa-upload"></i> Upload</button>
                        <button class="btn-primary" onclick="createFolder()" style="margin-left: 10px;"><i class="fas fa-folder-plus"></i> New Folder</button>
                    </div>
                </div>
                <div class="glass-card" style="padding: 20px;">
                    <div id="file-browser"></div>
                </div>
            `;
            
            renderFileBrowser(files);
            hideLoading();
        }

        function renderFileBrowser(files) {
            const container = document.getElementById('file-browser');
            if (files.length === 0) {
                container.innerHTML = '<p style="text-align: center; padding: 40px;">No files found</p>';
                return;
            }
            
            container.innerHTML = `
                <table style="width: 100%;">
                    <thead>
                        <tr><th>Name</th><th>Size</th><th>Modified</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
                        ${files.map(file => `
                            <tr class="file-item">
                                <td><i class="fas fa-${file.type === 'directory' ? 'folder' : 'file'}"></i> ${file.name}</td>
                                <td>${file.type === 'file' ? (file.size / 1024).toFixed(1) + ' KB' : '-'}</td>
                                <td>${new Date(file.modified).toLocaleDateString()}</td>
                                <td>
                                    <button onclick="deleteFile('${file.path}')" style="background: none; border: none; color: #FF3366; cursor: pointer;"><i class="fas fa-trash"></i></button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // API Calls
        async function fetchMetrics() {
            try {
                const response = await fetch(`${API_URL}/terminal/metrics`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                return await response.json();
            } catch {
                return { cpu: { usage: 0 }, memory: { used: 0 }, uptime: { system: 0 } };
            }
        }

        async function fetchDeployments() {
            try {
                const response = await fetch(`${API_URL}/deployments`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                return await response.json();
            } catch {
                return [];
            }
        }

        async function fetchFiles(dir) {
            try {
                const response = await fetch(`${API_URL}/files/list?dir=${encodeURIComponent(dir)}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                return await response.json();
            } catch {
                return [];
            }
        }

        async function startDeployment(id) {
            showLoading();
            await fetch(`${API_URL}/deployments/${id}/start`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
            });
            showToast('Deployment started');
            renderDeployments();
            hideLoading();
        }

        async function stopDeployment(id) {
            showLoading();
            await fetch(`${API_URL}/deployments/${id}/stop`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
            });
            showToast('Deployment stopped');
            renderDeployments();
            hideLoading();
        }

        async function deleteDeployment(id) {
            if (confirm('Are you sure?')) {
                showLoading();
                await fetch(`${API_URL}/deployments/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                showToast('Deployment deleted');
                renderDeployments();
                hideLoading();
            }
        }

        function showCreateDeploymentModal() {
            const name = prompt('Enter deployment name:');
            const type = prompt('Enter type (nodejs/python/php/static):');
            if (name && type) {
                createDeployment(name, type);
            }
        }

        async function createDeployment(name, type) {
            showLoading();
            await fetch(`${API_URL}/deployments`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                },
                body: JSON.stringify({ name, type })
            });
            showToast('Deployment created');
            renderDeployments();
            hideLoading();
        }

        async function uploadFile() {
            const input = document.createElement('input');
            input.type = 'file';
            input.onchange = async (e) => {
                const formData = new FormData();
                formData.append('file', e.target.files[0]);
                showLoading();
                await fetch(`${API_URL}/files/upload`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` },
                    body: formData
                });
                showToast('File uploaded');
                renderFileManager();
                hideLoading();
            };
            input.click();
        }

        async function createFolder() {
            const folderName = prompt('Enter folder name:');
            if (folderName) {
                showLoading();
                await fetch(`${API_URL}/files/folder`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ folderName })
                });
                showToast('Folder created');
                renderFileManager();
                hideLoading();
            }
        }

        async function deleteFile(path) {
            if (confirm('Delete this file?')) {
                showLoading();
                await fetch(`${API_URL}/files`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ path })
                });
                showToast('Deleted');
                renderFileManager();
                hideLoading();
            }
        }

        // Navigation
        const pages = {
            dashboard: { icon: 'fa-tachometer-alt', name: 'Dashboard', render: renderDashboard },
            deployments: { icon: 'fa-cloud-upload-alt', name: 'Deployments', render: renderDeployments },
            files: { icon: 'fa-folder', name: 'File Manager', render: renderFileManager },
            terminal: { icon: 'fa-terminal', name: 'Terminal', render: renderTerminal }
        };

        function renderSidebar() {
            const menu = document.getElementById('sidebar-menu');
            menu.innerHTML = Object.entries(pages).map(([key, page]) => `
                <div class="sidebar-item ${currentPage === key ? 'active' : ''}" onclick="navigateTo('${key}')">
                    <i class="fas ${page.icon}" style="margin-right: 12px;"></i>
                    ${page.name}
                </div>
            `).join('');
        }

        async function navigateTo(page) {
            currentPage = page;
            renderSidebar();
            await pages[page].render();
        }

        // Initialize App
        async function initApp() {
            document.getElementById('user-name').innerText = currentUser?.fullName || currentUser?.username;
            renderSidebar();
            await navigateTo('dashboard');
            hideLoading();
            
            // Setup Socket.IO for realtime
            socket = io();
            socket.emit('subscribe-monitoring', currentUser?.id);
            socket.on('metrics-update', (metrics) => {
                if (currentPage === 'dashboard') {
                    // Update dashboard metrics in realtime
                }
            });
        }

        // Event Listeners
        document.getElementById('menu-toggle')?.addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('main-content').classList.toggle('sidebar-open');
        });
        
        document.getElementById('logout-btn')?.addEventListener('click', logout);

        // Check authentication
        const token = localStorage.getItem('token');
        if (token) {
            // Validate token and get user info
            fetch(`${API_URL}/users/profile`, {
                headers: { 'Authorization': `Bearer ${token}` }
            }).then(res => res.json()).then(user => {
                if (user._id) {
                    currentUser = user;
                    initApp();
                } else {
                    showLoginPage();
                }
            }).catch(() => showLoginPage());
        } else {
            showLoginPage();
        }

        // Expose functions globally
        window.startDeployment = startDeployment;
        window.stopDeployment = stopDeployment;
        window.deleteDeployment = deleteDeployment;
        window.showCreateDeploymentModal = showCreateDeploymentModal;
        window.uploadFile = uploadFile;
        window.createFolder = createFolder;
        window.deleteFile = deleteFile;
        window.navigateTo = navigateTo;
    </script>
</body>
</html>
